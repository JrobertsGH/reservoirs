# Fall River Reservoir Dam - Idaho Springs, Clear Creek County, CO
# Sources: Colorado DWR dam inventory (data.colorado.gov/resource/mgjv-xmr5),
# 2021 CCLiDAR survey, and the 2025-07-16 Engineer's Inspection Report (EIR)
# -- see docs/data_sources.md. Supersedes the 2020-07-20 EIR previously used
# for condition narrative (geometry facts below were already consistent).
#
# 2025 EIR / GEI CDSE risk-assessment note: the highest-risk potential
# failure mode identified is internal erosion through the FOUNDATION via
# contact/scour erosion (PFM #10) -- "poor confidence," plotting in GEI's
# unacceptable-risk zone. Secondary elevated PFMs: internal erosion through
# the foundation (BEP, #7) and along the outlet conduit (#15). When running
# breach_params.estimate_all_methods() for this dam, treat
# FailureMode.piping as the primary scenario to report, with overtopping as
# a secondary/comparison case -- not the reverse.
#
# DWR's own 2025 EIR states plainly: "The current 1996 inundation map for
# Loch Lomond and Fall River is not helpful... A detailed inundation map
# should be developed for Loch Lomond and/or Fall River." That sentence is
# the direct regulatory basis for this entire project.
