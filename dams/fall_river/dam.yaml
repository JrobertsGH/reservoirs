# Fall River Reservoir is the lower dam in this two-reservoir cascade - no
# further reservoir downstream before Idaho Springs, so no cascade_downstream.
#
# NOTE (2020 & 2025 EIRs, "Conditionally Satisfactory" both times): known
# seepage at multiple mapped locations (Seeps A-F, including a historic
# sand boil at Seep D) and at the left groin, worsening through the summer
# as the reservoir stays full; owner has been directed to retain an
# engineer for a toe-drain fix. Relevant EAP narrative context, and
# consistent with the CDSE's foundation-erosion PFM findings above.

