[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoirs"
version = "0.1.0"
description = "Reusable dam-breach inundation mapping toolkit"
requires-python = ">=3.11"

[project.scripts]
reservoirs-breach-params = "reservoirs.cli:breach_params_cmd"
reservoirs-terrain = "reservoirs.cli:terrain_cmd"
reservoirs-storage-curve = "reservoirs.cli:storage_curve_cmd"
reservoirs-manning-lookup = "reservoirs.cli:manning_lookup_cmd"
reservoirs-structures = "reservoirs.cli:structures_cmd"
reservoirs-postprocess = "reservoirs.cli:postprocess_cmd"
reservoirs-mapping = "reservoirs.cli:mapping_cmd"

[tool.setuptools.packages.find]
where = ["src"]
