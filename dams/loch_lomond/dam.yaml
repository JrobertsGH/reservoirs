# Loch Lomond Dam - Clear Creek County, CO
# Sources: Colorado DWR dam inventory (data.colorado.gov/resource/mgjv-xmr5),
# 2021 CCLiDAR survey deliverables, and the 2025-07-16 Engineer's Inspection
# Report (EIR) -- see docs/data_sources.md.
#
# 2025 EIR / GEI CDSE risk-assessment note: the dam's Comprehensive Dam
# Safety Evaluation identifies internal erosion / piping along the outlet
# conduit (PFMs 15 and 17) as the highest-risk potential failure modes --
# "poor confidence" ratings near the boundary of "unacceptable" risk on
# GEI's matrix. When running breach_params.estimate_all_methods() for this
# dam, treat FailureMode.piping as the primary scenario to report, with
# overtopping as a secondary/comparison case -- not the reverse.
#
# DWR's own 2025 EIR states plainly: "The current 1996 inundation map for
# Loch Lomond and Fall River is not helpful... A detailed inundation map
# should be developed for Loch Lomond and/or Fall River." That sentence is
# the direct regulatory basis for this entire project.
name: "Loch Lomond"
state_dam_id: "070210"
nid_id: "00199"
county: "Clear Creek"
stream: "Fall River"
owner: "Agricultural Ditch & Reservoir Company"

location:
  latitude: 39.833713
  longitude: -105.675833

hazard_class: "High"
embankment_type: "Rock/Earth embankment"
year_completed: 1963

height_ft: 42.0
crest_length_ft: 875.0
crest_width_ft: 12.0  # per 2025 EIR
crest_elevation_ft: 11200.0

normal_storage_ac_ft: 875.0
surface_area_ac: 31.0

# = crest_elevation_ft - 3.5 ft freeboard, per LochLomond_EIR-20250716.pdf's own
# "FREEBOARD (FT): 3.5" field (2026-07-29). NOTE: the real (bathymetry-merged)
# DEM-derived storage curve gives ~1021.7 ac-ft at this elevation -- 17% over
# the reported 875 ac-ft normal storage -- while the curve actually matches
# 875 ac-ft almost exactly a few feet lower, around 11,191.5 ft. Both figures
# are sourced (one from the EIR, one from real bathymetric survey data); the
# ~5 ft discrepancy between them is unresolved and needs PE attention before
# either is treated as final. See docs/audit_trail.md.
normal_pool_elevation_ft: 11196.5

# NOTE (updated 2026-07-29, STILL UNVERIFIED -- needs PE sign-off): state
# record's 685 sq mi (438,400 ac) figure confirmed implausible; provisionally
# replaced below with a preliminary re-delineated estimate. Evidence trail:
#   - Physical constraint (unchanged): Fall River Reservoir sits 9 mi
#     *downstream* of Loch Lomond on the same stream and its own drainage
#     area is 1,792 ac (per its 2020 EIR) -- a downstream dam must have >=
#     the upstream dam's contributing area, so 438,400 ac (bigger than all
#     of Clear Creek County) is impossible on its face.
#   - Checked both network-share candidates this file previously pointed to
#     -- neither gives a usable area. "Fall River Watershed Topo.pdf" / "Fall
#     River Watershed.pdf" (Engineering\GIS_FILES\PMF\Projects\AdDitch
#     Mountain Reservoir Tour\) turn out to be orientation/locator maps
#     (topo + aerial basemap, a single "Fall River Watershed" pin) with no
#     delineated boundary or acreage callout -- the main map extent doesn't
#     even include Loch Lomond. A sibling file in that folder, "Mountain Res
#     Watershed Topo.pdf" (not previously catalogued), shows a wider view
#     with both a "Loch Lomand Watershed" and "Fall River Watershed" pin and
#     is useful for visual context (a small alpine cirque basin draining
#     Ohman/Steuart/Reynolds Lakes and Lake Caroline into Loch Lomond) -- but
#     its green boundary lines are Arapaho NF / James Peak Wilderness
#     administrative boundaries, not a hydrologic delineation, and it has no
#     acreage figure either. `FallRiver_ClearCreek.shp` (Engineering\
#     GIS_FILES\PMF\Projects\Quick Maps\Quick Maps\) turns out to be a
#     5-feature stream CENTERLINE layer (Unnamed Stream, Clear Creek x2,
#     Fall River, AgDitch) -- not a watershed boundary despite the "quick
#     maps" watershed-adjacent framing -- and its NHD-style attribute fields
#     (FTYPE/FCODE/STRM_LEVEL/METERS/FEET) are all unpopulated. It does
#     corroborate the cascade distance below (its "Fall River" line measures
#     ~49,301 ft = 9.3 mi) but gives no drainage-area figure.
#   - Independent public-data cross-check: the classic StreamStats REST API
#     (streamstats.usgs.gov/streamstatsservices/watershed.geojson) returned
#     HTTP 404 as of 2026-07-29 and appears to be down/retired -- could not
#     query StreamStats itself. Substituted USGS NLDI (built on the same
#     NHDPlus network StreamStats uses), which delineated the total upstream
#     basin at this dam's exact lat/lon (snapped ~5.8 m onto the mapped
#     flowline) at ~740 ac (1.16 sq mi). That polygon correctly contains
#     Lake Caroline (the known upstream tributary reservoir --
#     dams/lake_caroline/dam.yaml), supporting the delineation being
#     basically sound. Running the identical method on Fall River
#     Reservoir's own point reproduces ~2,102 ac against its accepted
#     1,792 ac (+17%), so treat NLDI's absolute number as order-of-magnitude
#     (roughly 700-900 ac), not precise. Also worth flagging: NLDI's mapped
#     flow network does NOT show Loch Lomond's flowline as topologically
#     upstream of Fall River Reservoir's snapped point within 20 km -- likely
#     an artifact of the AgDitch diversion (see shapefile above; same
#     "Agricultural Ditch & Reservoir Company" that owns both dams) or of
#     medium-resolution network simplification in this terrain. That's a
#     routing-network quirk, not necessarily an error in Loch Lomond's own
#     local catchment polygon, but it means NHDPlus/NLDI should not be
#     over-trusted here without the LiDAR-based recheck below.
# CONCLUSION: 438,400 ac is wrong; ~740 ac is a defensible preliminary
# replacement (same order of magnitude as, and smaller than, Fall River
# Reservoir's 1,792 ac, as physically required) but this is NOT a surveyed
# figure -- only one independent quantitative source (NLDI), not the two
# corroborating sources hoped for, since neither network-share file yielded
# a number. TODO(Phase 1): re-delineate from the 2021 LiDAR already in
# terrain_sources below (highest-resolution data on file, vs. NHDPlus's
# ~30 m DEM) and get PE sign-off before using this in the storage curve or
# any hydrology calc.
drainage_area_ac: 740.0  # UNVERIFIED - preliminary NLDI/NHDPlus estimate (was 438400.0 per state record); see note above, PE sign-off required

spillway_capacity_cfs: 1200.0

cascade_downstream:
  dam_id: "fall_river"
  distance_mi: 9.0
  note: >
    Loch Lomond's breach outflow travels down Fall River and reaches Fall
    River Reservoir before continuing toward Idaho Springs. Route the breach
    hydrograph through Fall River Reservoir rather than modeling in isolation.

# Upstream note (no schema field for this yet -- documented here, not
# modeled, since Lake Caroline is Low Hazard/no EAP required and tiny
# relative to Loch Lomond): Lake Caroline (State Dam ID 070211, see
# dams/lake_caroline/dam.yaml) sits upstream of Loch Lomond in the same
# drainage. It's small enough (10 ft, 144 AF) that its own failure isn't
# expected to meaningfully change Loch Lomond's breach scenario, but it's
# tracked for watershed/system completeness.

